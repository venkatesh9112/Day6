<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Object Demo</title>
</head>
<body>
    <h1>JS Object Demo</h1>
    <script>
        //create an object
        var a=10;
        a=20;
        var a=30;
        console.log("value of a is: ",a);
        document.write("value of a is: "+a);

        let b=10;
        b=20;
        //let b=30;
        console.log("value of b is: ",b);
        document.write("<br>value of b is: "+b);

        //object
        const student={
            name:"venkatesh",
            email:"venkatesh@email.com",
            age:20
        }
        console.log(student);
        document.write("<br><br>student name: "+student.name);
        document.write("<br>student email: "+student.email);
        document.write("<br>student age: "+student.age);
     </script>
</body>
</html>
